{% extends "mobile_base.html" %}
{% block title %}Escáner · RouteOps{% endblock %}
{% block content %}
<div class="mobile-title-row"><div><p class="eyebrow">{{wd.name}}</p><h1>Escanear paquete</h1></div></div>
<div class="scanner-box">
  <video id="scannerVideo" playsinline muted></video>
  <div class="scanner-frame"></div>
  <p id="scannerStatus">Pulsa iniciar cámara o escribe el código.</p>
</div>
<button class="btn primary full" id="startScanner" type="button">Iniciar cámara</button>
<form id="scanForm" method="post" action="{{url_for('driver_scan_lookup')}}" class="mobile-card stack">
  <label>Código / barcode / QR<input id="scanCode" name="code" autocomplete="off" inputmode="text" required></label>
  <button class="btn ghost full">Buscar paquete</button>
</form>
{% endblock %}
{% block scripts %}
<script>
const btn=document.getElementById('startScanner');
const video=document.getElementById('scannerVideo');
const statusEl=document.getElementById('scannerStatus');
const input=document.getElementById('scanCode');
const form=document.getElementById('scanForm');
let stream=null, detector=null, timer=null, busy=false;

async function stopScan(){
  if(timer) clearInterval(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null;timer=null;
}
btn.addEventListener('click',async()=>{
  if(!('BarcodeDetector' in window)){
    statusEl.textContent='Este navegador no tiene BarcodeDetector. Usa el campo manual o abre la app en Chrome/Android compatible.';
    return;
  }
  try{
    const formats=await BarcodeDetector.getSupportedFormats();
    detector=new BarcodeDetector({formats:formats.filter(x=>['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf'].includes(x))});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream;await video.play();
    statusEl.textContent='Apunta al código del paquete.';
    btn.textContent='Cámara activa';
    timer=setInterval(async()=>{
      if(busy||video.readyState<2) return;
      busy=true;
      try{
        const codes=await detector.detect(video);
        if(codes.length){
          input.value=codes[0].rawValue;
          statusEl.textContent='Código detectado: '+codes[0].rawValue;
          await stopScan();
          form.submit();
        }
      }catch(e){}
      busy=false;
    },500);
  }catch(e){statusEl.textContent='No se pudo abrir la cámara: '+e.message;}
});
window.addEventListener('beforeunload',stopScan);
</script>
{% endblock %}
