{% extends "mobile_base.html" %}
{% block title %}Revisar paquete · RouteOps{% endblock %}
{% block content %}<div class="mobile-title-row"><div><p class="eyebrow">Lectura de etiqueta</p><h1>Revisar paquete</h1></div></div><form method="post" class="mobile-card stack"><label>Operadora<select name="carrier"><option value="unknown" {% if p.carrier=='unknown' %}selected{% endif %}>Sin identificar</option><option value="imile" {% if p.carrier=='imile' %}selected{% endif %}>iMile</option><option value="ecoscooting" {% if p.carrier=='ecoscooting' %}selected{% endif %}>Ecoscooting</option><option value="agencia" {% if p.carrier=='agencia' %}selected{% endif %}>Tercera operadora / agencia</option></select></label><label>Tracking / código<input name="tracking_code" value="{{p.tracking_code or p.code}}" required></label><label>Destinatario<input name="recipient_name" value="{{p.recipient_name or ''}}"></label><label>Dirección<textarea name="address" rows="3" required>{{'' if p.address=='PENDIENTE DE REVISIÓN' else p.address}}</textarea></label><label>Código postal<input name="postal_code" value="{{p.postal_code or ''}}"></label><label>Zona<input name="route_zone" value="{{p.route_zone or ''}}"></label><label>Ruta<input name="route_code" value="{{p.route_code or ''}}"></label><button class="btn primary full">Guardar y reoptimizar</button></form>{% endblock %}
