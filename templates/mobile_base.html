<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1730">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}RouteOps Driver{% endblock %}</title>
</head>
<body class="mobile-body">
<div class="mobile-shell">
  <header class="mobile-header">
    <a class="brand mobile-brand" href="{{ url_for('driver_home') }}"><span class="brand-pin">●</span>RouteOps</a>
    <a class="icon-btn" href="{{ url_for('logout') }}">↪</a>
  </header>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category,message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <div id="secureContextBanner" class="secure-context-banner" hidden></div>
  <main class="mobile-main">{% block content %}{% endblock %}</main>
  <nav class="mobile-nav">
    <a href="{{ url_for('driver_home') }}">⌂<small>Inicio</small></a>
    <a href="{{ url_for('driver_route') }}">☷<small>Ruta</small></a>
    <a href="{{ url_for('driver_intake') }}">▣<small>Recibir</small></a>
  </nav>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
const scb=document.getElementById("secureContextBanner");
if(scb && !window.isSecureContext){scb.hidden=false;scb.textContent="Modo no seguro: cámara, GPS y PWA pueden estar bloqueados. Abre RouteOps mediante la dirección HTTPS del piloto.";}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
